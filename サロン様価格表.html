<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MIAN BEAUTY 価格検索</title>
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/3461/3461285.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&display=swap');
        body { 
            font-family: 'Noto Sans JP', sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            user-select: none;
        }
        .sticky-header { position: sticky; top: 0; z-index: 50; }
        .price-card { transition: transform 0.1s; border-radius: 1rem; }
        .price-card:active { transform: scale(0.96); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        
        .major-tab-active { color: #e11d48; font-weight: 900; border-bottom: 3px solid #e11d48; }
        .major-tab-inactive { color: #94a3b8; font-weight: 700; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen pb-24">

<div id="app">
    <header class="sticky-header bg-white shadow-md">
        <div class="px-4 py-3 bg-zinc-900 text-white flex justify-between items-center">
            <h1 class="text-base font-black tracking-tighter italic">MIAN BEAUTY <span class="text-[10px] font-normal not-italic opacity-60 ml-1">OFFICIAL PRICE LIST</span></h1>
        </div>

        <div class="flex gap-6 overflow-x-auto px-4 pt-3 bg-white no-scrollbar border-b border-slate-100">
            <button 
                v-for="major in categoriesList" 
                @click="selectMajor(major)"
                :class="selectedMajor === major ? 'major-tab-active' : 'major-tab-inactive'"
                class="whitespace-nowrap text-sm pb-2 transition-all uppercase tracking-tighter"
            >
                {{ major }}
            </button>
        </div>

        <div class="flex gap-2 overflow-x-auto px-3 py-3 bg-slate-50 no-scrollbar border-b border-slate-100">
            <button 
                v-for="brand in availableBrands" 
                @click="selectedBrand = brand"
                :class="selectedBrand === brand ? 'bg-indigo-600 text-white shadow-md' : 'bg-white text-slate-600 border-slate-200'"
                class="px-4 py-1.5 rounded-full border whitespace-nowrap text-xs font-black transition-all"
            >
                {{ brand }}
            </button>
        </div>

        <div class="px-3 py-3 bg-white">
            <div class="relative">
                <input 
                    type="text" 
                    v-model="searchQuery" 
                    placeholder="商品名で検索..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-slate-100 border-none rounded-xl focus:ring-2 focus:ring-rose-500 text-base font-medium"
                >
                <div class="absolute left-3 top-2.5 text-slate-400">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
                    </svg>
                </div>
            </div>
        </div>
    </header>

    <main class="p-3">
        <div class="mb-3 px-1 flex justify-between items-end border-l-4 border-rose-500 pl-2">
            <h2 class="text-lg font-black text-slate-800 leading-none">{{ selectedBrand }}</h2>
            <span class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">{{ filteredItems.length }} items</span>
        </div>

        <div class="grid grid-cols-2 gap-3">
            <div v-for="(item, index) in filteredItems" :key="index" class="price-card bg-white shadow-sm border border-slate-200 flex flex-col overflow-hidden">
                <div class="p-3 flex-1">
                    <div class="text-[9px] font-black text-rose-500 mb-1 tracking-tighter">{{ item.brand }}</div>
                    <h3 class="text-[12px] font-bold text-slate-800 leading-tight h-12 overflow-hidden mb-1.5">
                        {{ item.name }}
                    </h3>
                    <div class="text-[13px] font-black text-slate-600 bg-slate-100 px-1.5 py-0.5 rounded inline-block">
                        {{ item.capacity }}
                    </div>
                </div>
                
                <div class="px-3 py-3 bg-indigo-50 border-t border-indigo-100">
                    <div class="text-[10px] text-indigo-400 font-bold uppercase tracking-tight mb-0.5">定価 (税抜)</div>
                    <div class="text-2xl font-black text-indigo-700 leading-none">
                        <span class="text-sm mr-0.5 font-bold">¥</span>{{ formatPrice(item.price) }}
                    </div>
                </div>
            </div>
        </div>

        <div v-if="filteredItems.length === 0" class="py-20 text-center">
            <p class="text-slate-400 font-bold italic">該当商品が見つかりません</p>
        </div>
    </main>

    <footer class="fixed bottom-0 left-0 right-0 bg-white/90 backdrop-blur-md border-t border-slate-200 p-4 text-center shadow-lg">
        <p class="text-[10px] text-slate-400 font-black tracking-widest uppercase italic">Supported by Gemini | 2026.02 MIAN BEAUTY Sales Support</p>
    </footer>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
<script>
    const { createApp, ref, computed } = Vue;

    const MAJOR_CATEGORIES = ['ヘアケア', 'トリートメント', 'スタイリング', 'レジェンド', 'スキンケア'];

    const PRODUCT_DATA = [
        // --- ヘアケア (CE3) ---
        { major: 'ヘアケア', brand: 'CE3', name: "CE3 シャンプー", capacity: "800mLリフィル", price: 1400 },
        { major: 'ヘアケア', brand: 'CE3', name: "CE3 シャンプー店販用", capacity: "1,000mL", price: 2400 },
        { major: 'ヘアケア', brand: 'CE3', name: "CE3 コンディショナー", capacity: "2,000 g x2", price: 3400 },
        { major: 'ヘアケア', brand: 'CE3', name: "CE3 トリートメント", capacity: "750gリフィル", price: 1500 },
        { major: 'ヘアケア', brand: 'CE3', name: "CE3 トリートメント店販用", capacity: "1,000g", price: 2600 },
        { major: 'ヘアケア', brand: 'CE3', name: "CE3 共通詰替えボトル(識別シール付)", capacity: "1,000mL/g用", price: 600 },
        // --- エイジケア ---
        { major: 'ヘアケア', brand: 'エイジケア', name: "クレイシャンプー", capacity: "290mL", price: 1600 },
        { major: 'ヘアケア', brand: 'エイジケア', name: "クレイシャンプー リフィル", capacity: "550mL", price: 2500 },
        { major: 'ヘアケア', brand: 'エイジケア', name: "クレイヘアパック", capacity: "210g", price: 1600 },
        { major: 'ヘアケア', brand: 'エイジケア', name: "クレイヘアパック リフィル", capacity: "550g", price: 2500 },
        { major: 'ヘアケア', brand: 'エイジケア', name: "薬用エイジキュアLC育毛剤", capacity: "150mL", price: 4000 },
        // --- ルッチ ---
        { major: 'ヘアケア', brand: 'ルッチ', name: "ルッチ メルティフルウォッシュ", capacity: "245mL", price: 1600 },
        { major: 'ヘアケア', brand: 'ルッチ', name: "ルッチ メルティフルウォッシュ リフィル", capacity: "550mL", price: 2300 },
        { major: 'ヘアケア', brand: 'ルッチ', name: "ルッチ メルティフルバック", capacity: "200g", price: 1600 },
        // --- シーズントリップ ---
        { major: 'ヘアケア', brand: 'シーズントリップ', name: "スーパークールシャンプー", capacity: "300mL", price: 1800 },
        { major: 'ヘアケア', brand: 'シーズントリップ', name: "マイルドクールシャンプー", capacity: "300mL", price: 1800 },
        { major: 'ヘアケア', brand: 'シーズントリップ', name: "シーズントリップ トリートメント", capacity: "230g", price: 1800 },
        // --- ピュアファクター ---
        { major: 'ヘアケア', brand: 'ピュアファクター', name: "ピュアファクター シャンプー", capacity: "300mL", price: 1700 },
        { major: 'ヘアケア', brand: 'ピュアファクター', name: "ピュアファクター モイストパック", capacity: "230g", price: 1700 },
        // --- ディープエレメント ---
        { major: 'ヘアケア', brand: 'ディープエレメント', name: "SVシャンプー", capacity: "300mL", price: 1700 },
        { major: 'ヘアケア', brand: 'ディープエレメント', name: "MAシャンプー", capacity: "300mL", price: 1700 },
        // --- ランドケア ---
        { major: 'ヘアケア', brand: 'ランドケア', name: "ランドケア エッセンスソープ", capacity: "300mL", price: 5600 },
        // --- モルティナ (トリートメント) ---
        { major: 'トリートメント', brand: 'モルティナ', name: "スムースウォッシュ ソフト", capacity: "210mL", price: 2400 },
        { major: 'トリートメント', brand: 'モルティナ', name: "スリークチャージ", capacity: "200g", price: 2400 },
        { major: 'トリートメント', brand: 'モルティナ', name: "モイストチャージ", capacity: "200g", price: 2400 },
        { major: 'トリートメント', brand: 'モルティナ', name: "シャイニーオイル", capacity: "80mL", price: 2800 },
        // --- アクアクチュール ---
        { major: 'トリートメント', brand: 'アクアクチュール', name: "アクアクチュール CMCミスト", capacity: "150mL", price: 1800 },
        // --- スタイリング ---
        { major: 'スタイリング', brand: 'モノーク', name: "モノーク オイル", capacity: "60mL", price: 3400 },
        { major: 'スタイリング', brand: 'ノフィ', name: "ノフィ フォルムメイクスプレー", capacity: "180g", price: 1300 },
        { major: 'スタイリング', brand: 'ルッチ', name: "ルッチ フラッフィラテ", capacity: "150mL", price: 1800 },
        // --- レジェンド ---
        { major: 'レジェンド', brand: 'エメラルド', name: "エメラルド", capacity: "275g(400mL)", price: 1500 },
        { major: 'レジェンド', brand: 'サファイア', name: "サファイア", capacity: "246g(360mL)", price: 1100 },
        // --- スキンケア ---
        { major: 'スキンケア', brand: 'モチュレ', name: "アスタリノ", capacity: "120g", price: 3000 },
        { major: 'スキンケア', brand: 'モチュレ', name: "プラセリカ", capacity: "150g", price: 3000 }
    ];

    createApp({
        setup() {
            const searchQuery = ref('');
            const selectedMajor = ref('ヘアケア');
            const selectedBrand = ref('すべて');

            const availableBrands = computed(() => {
                const brands = PRODUCT_DATA
                    .filter(item => item.major === selectedMajor.value)
                    .map(item => item.brand);
                return ['すべて', ...new Set(brands)];
            });

            const selectMajor = (major) => {
                selectedMajor.value = major;
                selectedBrand.value = 'すべて';
            };

            const filteredItems = computed(() => {
                return PRODUCT_DATA.filter(item => {
                    const search = searchQuery.value.toLowerCase();
                    const matchesSearch = item.name.toLowerCase().includes(search) || 
                                         item.brand.toLowerCase().includes(search);
                    const matchesMajor = item.major === selectedMajor.value;
                    const matchesBrand = selectedBrand.value === 'すべて' || item.brand === selectedBrand.value;
                    return matchesMajor && matchesBrand && matchesSearch;
                });
            });

            const formatPrice = (price) => {
                return new Intl.NumberFormat('ja-JP').format(Math.round(price));
            };

            return {
                searchQuery,
                selectedMajor,
                selectedBrand,
                categoriesList: MAJOR_CATEGORIES,
                availableBrands,
                filteredItems,
                formatPrice,
                selectMajor
            };
        }
    }).mount('#app');
</script>
</body>
</html>
